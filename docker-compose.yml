version: '3.8'

services:
  ssl-checker-pro:
    build: .
    container_name: ssl-checker-pro
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ALLOWED_ORIGINS=https://localhost
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ssl-checker-network

  nginx:
    image: nginx:alpine
    container_name: ssl-checker-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - ssl-checker-pro
    restart: unless-stopped
    networks:
      - ssl-checker-network

networks:
  ssl-checker-network:
    driver: bridge
